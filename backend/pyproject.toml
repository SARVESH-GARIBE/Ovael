[project]
name = "ovael-backend"
version = "0.1.0"
description = "ovael.ai backend: network protection + website analysis"
requires-python = ">=3.11"

[project.scripts]
ovael = "ovael.cli:main"

[tool.setuptools.packages.find]
include = ["ovael*"]

[tool.setuptools.package-data]
"ovael.scanner" = ["lists/*.txt"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
