# ovael.ai - full deployment.
#
#   cp .env.example .env               # set tokens and passwords
#   docker compose up -d --build       # core platform at http://localhost:8088
#   docker compose --profile sandbox up -d      # + victim/sensor, defense agent, normal client
#   docker compose --profile sandbox run --rm replayer   # replay real CIC-IDS2017 attack flows
#   docker compose --profile monitoring up -d   # + Prometheus (http://localhost:9090) and Grafana (:3000)
#   docker compose up -d --scale api=4 --scale scan-worker=3   # scale the bottleneck
#
# Networks (who can talk to whom):
#   edge      nginx <-> api                        (only nginx publishes a port)
#   backend   api, workers <-> postgres, redis
#   scan_ctl  scan workers <-> scanner             (scanner cannot reach postgres/redis)
#   scan_out  scanner -> internet
#   control   sensor / defense agent <-> nginx, api (flows in, block commands out)
#   sandbox   client <-> victim, internal only (172.28.0.0/16, no route out)
#
# (":z" relabels the mount for SELinux hosts such as Fedora; harmless elsewhere.)
# Real data: ./data (CIC-IDS2017 after `ovael dataset import-cicids`) is mounted read-only, so the
# models train on it and the replayer replays it. Without it everything falls back to synthetic.

name: ovael

x-app: &app
  build:
    context: ..
    dockerfile: backend/Dockerfile
    target: api
  image: ovael/api:latest
  env_file: .env
  environment: &app-env
    OVAEL_ENV: prod
    OVAEL_LOG_JSON: "true"
    OVAEL_DATABASE_URL: postgresql+asyncpg://ovael:${POSTGRES_PASSWORD:-ovael}@postgres:5432/ovael
    OVAEL_REDIS_URL: redis://redis:6379/0
    OVAEL_CELERY_BROKER_URL: redis://redis:6379/1
    OVAEL_SCANNER_URL: http://scanner:9200
    OVAEL_AUTO_CREATE_SCHEMA: "false"
  volumes:
    - models:/models
    - ./data:/app/backend/data:ro,z
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
    migrate: { condition: service_completed_successfully }
  restart: unless-stopped

services:
  # ------------------------------------------------------------------ edge
  nginx:
    build:
      context: ..
      dockerfile: backend/deploy/nginx/Dockerfile
    image: ovael/web:latest
    ports: ["${OVAEL_HTTP_PORT:-8088}:80"]
    depends_on: [api]
    networks: [edge, control]
    restart: unless-stopped

  # ------------------------------------------------------------------ app
  api:
    <<: *app
    deploy:
      replicas: 2
      resources:
        limits: { cpus: "1.5", memory: 1g }
    environment:
      <<: *app-env
      OVAEL_DEFENSE_AGENT_URL: ${OVAEL_DEFENSE_AGENT_URL:-}
    networks: [edge, backend, control]

  scan-worker:
    <<: *app
    command: celery -A ovael.workers.celery_app worker -Q scans -c 2 --without-gossip --without-mingle
    networks: [backend, scan_ctl]

  train-worker:
    <<: *app
    command: celery -A ovael.workers.celery_app worker -Q training -c 1 --without-gossip --without-mingle
    networks: [backend]

  # one-shot: create schema, train bootstrap models if none exist
  migrate:
    build:
      context: ..
      dockerfile: backend/Dockerfile
      target: api
    image: ovael/api:latest
    env_file: .env
    environment:
      OVAEL_DATABASE_URL: postgresql+asyncpg://ovael:${POSTGRES_PASSWORD:-ovael}@postgres:5432/ovael
    command: sh -c "python -m ovael.cli init-db && python -m ovael.cli train all"
    volumes: ["models:/models", "./data:/app/backend/data:ro,z"]
    depends_on:
      postgres: { condition: service_healthy }
    networks: [backend]
    restart: "no"

  scanner:
    build:
      context: ..
      dockerfile: backend/Dockerfile
      target: scanner
    image: ovael/scanner:latest
    environment:
      OVAEL_MAX_CONCURRENT_SCANS: "2"
      OVAEL_SCANNER_TOKEN: ${OVAEL_SCANNER_TOKEN:-}
    shm_size: 1g
    deploy:
      resources:
        limits: { cpus: "2", memory: 2g }
    networks: [scan_ctl, scan_out]
    restart: unless-stopped

  # ------------------------------------------------------------------ data
  postgres:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_USER: ovael
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ovael}
      POSTGRES_DB: ovael
    command: ["postgres", "-c", "max_connections=200", "-c", "shared_buffers=256MB"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ovael"]
      interval: 5s
      retries: 10
    networks: [backend]
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
    networks: [backend]
    restart: unless-stopped

  # ------------------------------------------------------------------ sandbox (profile)
  # Defensive side only. Normal traffic is live (client -> victim, captured by the sensor);
  # attack traffic enters as replayed real CIC-IDS2017 flows (replayer). No attack generators.
  victim:
    profiles: [sandbox]
    build:
      context: .
      dockerfile: sandbox/victim/Dockerfile
    image: ovael/victim:latest
    environment:
      OVAEL_API_URL: http://nginx/api/flows
      OVAEL_SENSOR_TOKEN: ${OVAEL_SENSOR_TOKEN:-}
      OVAEL_SANDBOX_SUBNET: 172.28.0.0/16
    cap_add: [NET_RAW]
    depends_on: [nginx]
    networks:
      sandbox: { ipv4_address: 172.28.0.10 }
      control: {}
    restart: unless-stopped

  defense-agent:
    profiles: [sandbox]
    build:
      context: ..
      dockerfile: backend/Dockerfile
      target: defense-agent
    image: ovael/defense-agent:latest
    network_mode: "service:victim"   # same network namespace: rules apply to the victim only
    cap_add: [NET_ADMIN]
    environment:
      OVAEL_SANDBOX_SUBNET: 172.28.0.0/16
      OVAEL_DEFENSE_TOKEN: ${OVAEL_DEFENSE_TOKEN:-}
      OVAEL_DEFENSE_PROTECTED_IPS: 172.28.0.10,172.28.0.20
    depends_on: [victim]
    restart: unless-stopped

  client:
    profiles: [sandbox]
    build: ./sandbox/client
    image: ovael/client:latest
    environment:
      TARGET: http://172.28.0.10
    depends_on: [victim]
    networks:
      sandbox: { ipv4_address: 172.28.0.20 }
    restart: unless-stopped

  replayer:
    profiles: [sandbox]
    image: ovael/api:latest
    env_file: .env
    command: python -m ovael.cli replay --api http://nginx/api/flows --scenario full_demo --duration 90
    volumes: ["./data:/app/backend/data:ro,z"]
    depends_on: [nginx]
    networks: [control]
    restart: "no"

  # ------------------------------------------------------------------ monitoring (profile)
  prometheus:
    profiles: [monitoring]
    image: prom/prometheus:v3.1.0
    volumes: ["./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro,z"]
    ports: ["9090:9090"]
    networks: [edge]

  grafana:
    profiles: [monitoring]
    image: grafana/grafana:11.4.0
    ports: ["3000:3000"]
    networks: [edge]

networks:
  edge: {}
  backend: { internal: true }
  control: { internal: true }
  scan_ctl: { internal: true }
  scan_out: {}
  sandbox:
    internal: true
    ipam:
      config: [{ subnet: 172.28.0.0/16 }]

volumes:
  models: {}
  pgdata: {}
  redisdata: {}
