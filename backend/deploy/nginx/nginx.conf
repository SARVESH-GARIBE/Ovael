# Load balancer + static frontend.
#
# The API instances are stateless, so plain least-connections balancing is enough: no sticky
# sessions, because live events reach every instance through Redis pub/sub.

worker_processes auto;
events { worker_connections 4096; }

http {
  include       /etc/nginx/mime.types;
  sendfile      on;
  server_tokens off;
  gzip          on;
  gzip_types    application/json text/css application/javascript;

  # Docker's DNS; re-resolves "api" so scaled-up replicas join without an nginx restart.
  resolver 127.0.0.11 valid=10s ipv6=off;

  upstream api {
    least_conn;
    zone api 64k;
    server api:8000 resolve max_fails=3 fail_timeout=10s;
    keepalive 64;
  }

  # Website scans start a browser on our side: strict per-client limit (section 7.1).
  limit_req_zone $binary_remote_addr zone=scans:10m rate=10r/m;
  limit_req_zone $binary_remote_addr zone=api:10m   rate=50r/s;
  limit_req_status 429;

  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  server {
    listen 80;
    client_max_body_size 2m;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id      $request_id;

    location = /api/scans {
      limit_req zone=scans burst=5 nodelay;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_pass http://api;
    }

    location /api/ {
      limit_req zone=api burst=100 nodelay;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_next_upstream error timeout http_502 http_503;
      proxy_pass http://api;
    }

    location = /ws {
      proxy_http_version 1.1;
      proxy_set_header Upgrade    $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 1h;
      proxy_send_timeout 1h;
      proxy_pass http://api;
    }

    location = /metrics { deny all; }

    location / {
      root /usr/share/nginx/html;
      try_files $uri /index.html;
    }

    location /assets/ {
      root /usr/share/nginx/html;
      expires 1y;
      add_header Cache-Control "public, immutable";
    }
  }
}
